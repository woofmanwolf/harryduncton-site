name: Update latest work

on:
  schedule:
    - cron: "17 6 * * *"   # every morning at 06:17 UTC
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new clips
        run: python scripts/update_clips.py
      - name: Save changes
        run: |
          git config user.name "clips-bot"
          git config user.email "clips-bot@users.noreply.github.com"
          git add index.html data/found.json data/review.json
          git diff --staged --quiet || git commit -m "Update latest work"
          git push
